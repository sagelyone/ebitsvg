<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 30 30">
  <rect x="2" y="2" width="26" height="8" fill="url(#late)"/>
  <defs>
    <linearGradient id="base">
      <stop offset="0%" style="stop-color:#e11;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1e1;stop-opacity:.4"/>
      <stop offset="100%" style="stop-color:#11e"/>
    </linearGradient>
    <linearGradient id="late" xlink:href="#base" x1="0" y1="0" x2="1" y2="0"/>
    <linearGradient id="u" xlink:href="#base" gradientUnits="userSpaceOnUse" x1="2" y1="0" x2="28" y2="0"/>
  </defs>
  <rect x="2" y="12" width="26" height="7" fill="url(#u)"/>
  <rect x="2" y="21" width="26" height="7" fill="url(#base)" fill-opacity=".5"/>
</svg>
