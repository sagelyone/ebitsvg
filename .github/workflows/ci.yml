name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Ebitengine loads these at run time; it needs no headers to build.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libgl1-mesa-dri libx11-6 libxcursor1 libxext6 libxi6 libxinerama1 libxrandr2 libxrender1 xvfb
      - run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: xvfb-run -a go test -race ./...
      - run: GOOS=js GOARCH=wasm go build ./...
      - run: GOOS=windows go build ./...
      - run: GOOS=darwin go build ./...

  # The analyzers need a newer Go than the minimum go.mod declares, and
  # govulncheck should judge the standard library users will build with.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
